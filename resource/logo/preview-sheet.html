<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:880px; background:#F1F1EA; padding:60px 72px;
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif; color:#1F2937;
  }
  .title { font-size:26px; font-weight:600; letter-spacing:1px; }
  .sub { font-size:14px; color:#8A9199; letter-spacing:.5px; margin:6px 0 34px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; }
  .cell { text-align:center; }
  .cell img { display:block; border-radius:20px; }
  .cap { margin-top:12px; font-size:14px; color:#767C84; letter-spacing:.3px; }
  .logo { margin-top:40px; padding-top:34px; border-top:1px solid #DEDED4; display:flex; gap:60px; align-items:flex-start; }
  .logo img { display:block; }
  .lbl { font-size:13px; color:#8A9199; letter-spacing:.5px; margin-top:10px; }
  .pad { background:#3A9D6E; border-radius:20px; padding:24px; }
  .pad2 { background:#FBFBF7; border:1px dashed #CFCFC4; border-radius:20px; padding:24px; }
</style></head>
<body>
  <div class="title">识法 LawSense</div>
  <div class="sub">看得懂的法律常识 · 品牌标识规范 v1.0</div>

  <div class="row">
    <div class="cell">
      <img src="icon-app.svg" width="200" height="200">
      <div class="cap">主图标 · 竹青绿底</div>
    </div>
    <div class="cell">
      <img src="icon-app-light.svg" width="200" height="200">
      <div class="cap">浅色版 · 纸白底</div>
    </div>
    <div class="cell">
      <img src="icon-app-dark.svg" width="200" height="200">
      <div class="cap">深色版 · Dark Mode</div>
    </div>
    <div class="cell">
      <div class="pad"><img src="mark-white.svg" width="152" height="110"></div>
      <div class="cap">纯标志 · 反白</div>
    </div>
    <div class="cell">
      <div class="pad2"><img src="mark.svg" width="152" height="110"></div>
      <div class="cap">纯标志 · 单色</div>
    </div>
    <div class="cell">
      <div style="height:200px;display:flex;align-items:center;justify-content:center">
        <img src="png/icon-60.png" width="60" height="60" style="border-radius:13px">
      </div>
      <div class="cap">60px 实际尺寸</div>
    </div>
  </div>

  <div class="logo">
    <div>
      <img src="logo-horizontal.svg" width="560" height="288">
      <div class="lbl">横版主锁版 · 官网、商店截图、文档页眉</div>
    </div>
    <div>
      <img src="logo-vertical.svg" width="250" height="288">
      <div class="lbl">竖版锁版 · 启动页、分享卡</div>
    </div>
  </div>
</body></html>
